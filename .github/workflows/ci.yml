name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilar
        run: dotnet build --nologo -warnaserror

      - name: Pruebas C# sobre el codigo real (puerta de calidad)
        run: dotnet run --project tests/Chixi.Tests/Chixi.Tests.csproj

      - name: Comparativa v0 contra v1.0
        run: dotnet run --no-build

      - name: Medicion de tiempo por cuadro
        run: dotnet run --no-build -- --bench metrics/bench-ci.csv

      - name: Guardar datos de medicion
        uses: actions/upload-artifact@v4
        with:
          name: bench-ci
          path: metrics/bench-ci.csv
